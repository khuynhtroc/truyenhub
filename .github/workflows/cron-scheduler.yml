name: Scheduled Cron Jobs (Social Backfill & AI Trends)

on:
  schedule:
    # Runs every 15 minutes to check if scheduled social backfill or trends are due
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      force_post:
        description: 'Force immediate social post regardless of schedule timer (true/false)'
        required: false
        default: 'false'

jobs:
  run-cron-tasks:
    name: Execute Periodic Site Automation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Trigger Social Backfill Queue (Facebook & Connected Channels)
        run: |
          FORCE="${{ github.event.inputs.force_post || 'false' }}"
          ENDPOINT="https://www.doctruyen.vip/api/cron/social-backfill"
          if [ "$FORCE" = "true" ]; then
            ENDPOINT="${ENDPOINT}?force=true"
          fi
          echo "Calling Social Backfill endpoint: $ENDPOINT"
          RESPONSE=$(curl -s -L --max-time 30 "$ENDPOINT")
          echo "Response: $RESPONSE"

      - name: Trigger AI Trending News Generator
        run: |
          ENDPOINT="https://www.doctruyen.vip/api/cron/trends"
          echo "Calling Trends endpoint: $ENDPOINT"
          RESPONSE=$(curl -s -L --max-time 60 "$ENDPOINT")
          echo "Response: $RESPONSE"
